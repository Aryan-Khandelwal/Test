<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RosterFlow · Provider Data Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#14181f;--ink2:#4a5261;--ink3:#8a92a1;--line:#e3e6eb;
  --accent:#2453d6;--accent-soft:#e9effd;--good:#15803d;--good-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf3e4;
  --bad:#b91c1c;--bad-soft:#fdeceb;--violet:#6d3fd1;--violet-soft:#f1ebfd;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:#0f1726;color:#c9d1df;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{color:#fff;font-weight:700;font-size:16px;padding:4px 10px 2px}
.brand-sub{font-size:11px;color:#7d8aa3;padding:0 10px 16px}
nav a{display:flex;align-items:center;justify-content:space-between;color:#c9d1df;text-decoration:none;padding:9px 10px;border-radius:7px;font-size:13.5px}
nav a:hover{background:#1b2638}
nav a.active{background:#24324a;color:#fff}
nav .badge{background:#33425e;color:#dfe6f3;border-radius:10px;font-size:11px;padding:1px 7px}
nav .sect{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#64728c;padding:14px 10px 4px}
.navfoot{margin-top:auto;font-size:11px;color:#64728c;padding:10px}
main{padding:24px 32px 60px;max-width:1280px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:21px;margin:0 0 3px}
.lede{color:var(--ink2);margin:0;max-width:760px}
.toggle{display:flex;background:#e8ebf0;border-radius:8px;padding:3px;flex-shrink:0}
.toggle button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.kpi .lab{font-size:12px;color:var(--ink3)}
.kpi .val{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink2)}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #eff1f4;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f9fb}
tr.sel td{background:var(--accent-soft)!important}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-vio{background:var(--violet-soft);color:var(--violet)}.p-grey{background:#eef0f3;color:var(--ink2)}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f5f8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:#1c45b8}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.bar{height:6px;background:#eceff3;border-radius:4px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.ev{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eceff3;font-size:13px}
.ev:last-child{border:0}
.muted{color:var(--ink3)}.small{font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.compare>div{padding:14px 16px}
.compare .before{background:#fbf7f2}.compare .after{background:#f2f8f4;border-left:1px solid var(--line)}
.compare h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
.step.h{border-color:#f0c9a0}.step.a{border-color:#b6dcc3}
.arrow{color:var(--ink3);font-size:12px}
.stat{font-size:12.5px;margin-top:8px;color:var(--ink2)}
.stat b{color:var(--ink)}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.flow .node{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;cursor:pointer}
.flow .node:hover{border-color:var(--accent)}
.flow .node b{display:block;font-size:13px}.flow .node span{font-size:11.5px;color:var(--ink3)}
.flow .node .n{font-size:20px;font-weight:700;margin-top:4px}
.transcript{background:#0f1726;color:#dfe6f3;border-radius:8px;padding:12px;font-family:"JetBrains Mono",monospace;font-size:12px;min-height:150px;white-space:pre-wrap}
.transcript .ag{color:#8fb3ff}.transcript .of{color:#ffd59a}.transcript .sys{color:#7fd6a3}
.toast{position:fixed;bottom:20px;right:20px;background:#14181f;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:380px}
.toast.show{opacity:1;transform:none}
.banner{background:var(--warn-soft);border:1px solid #f3d7ae;color:#7a4206;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.chk{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.progress{height:8px;background:#eceff3;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff}
.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.navfoot,.sect,.brand-sub{display:none}.g4,.g3,.g2,.split{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>

  <div class="navfoot">Demo environment · synthetic data only<br><a href="#" id="reset" style="padding:0;color:#8fa2c4">Reset data</a></div>
</nav>
<main id="main"></main>
</div>

function confColor(c){return c>=0.9?'var(--good)':c>=0.7?'var(--warn)':'var(--bad)'}
function confBar(c){return `<span class="bar"><i style="width:${Math.round(c*100)}%;background:${confColor(c)}"></i></span> <span class="mono">${Math.round(c*100)}%</span>`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
let clock = new Date('2026-11-11T09:12:00');
function stamp(){clock = new Date(clock.getTime()+ (40+Math.random()*120)*1000); return clock.toTimeString().slice(0,5)}
function log(actor, action, detail){S.audit.unshift({t:stamp(), actor, action, detail});}
const kindPill = k=>{
  const m={'Address change':'p-acc','Phone change':'p-acc','Specialty conflict':'p-warn','Missing NPI':'p-bad','Duplicate row':'p-grey','Retro termination':'p-warn','Possible ghost listing':'p-vio','Invalid phone':'p-bad','License lapsed':'p-bad'};
  return `<span class="pill ${m[k]||'p-grey'}">${esc(k)}</span>`};
const statusPill = s=>{const m={'Open':'p-warn','Auto-resolved':'p-good','Approved':'p-good','Overridden':'p-acc','In outreach':'p-vio','Resolved via outreach':'p-good','Received':'p-grey','Mapped':'p-acc','Processed':'p-good','Queued':'p-grey','Confirmed':'p-good','Changed':'p-acc','No answer':'p-warn','Provider left practice':'p-bad'};return `<span class="pill ${m[s]||'p-grey'}">${esc(s)}</span>`};

/* ---------------- metrics ---------------- */
function metrics(){
  const processed = S.rosters.filter(r=>r.status==='Processed');
  const rowsProcessed = processed.reduce((a,r)=>a+r.rows,0);
  const exc = S.exceptions;
  const open = exc.filter(e=>e.status==='Open').length;
  const inOut = exc.filter(e=>e.status==='In outreach').length;
  const done = exc.filter(e=>!['Open','In outreach'].includes(e.status)).length;
  const touchless = rowsProcessed? (rowsProcessed - exc.filter(e=>!e.auto).length)/rowsProcessed : 0;
  const totalIssues = DATA.issues.length;
  const fixed = done;
  // directory accuracy: share of 48 providers with no unresolved known issue
  const issueProv = new Set(DATA.issues.filter(i=>i.pid).map(i=>i.pid));
  const resolvedProv = new Set(exc.filter(e=>!['Open','In outreach'].includes(e.status) && e.pid).map(e=>e.pid));
  const badNow = [...issueProv].filter(p=>!resolvedProv.has(p)).length;
  const acc = (DATA.providers.length - badNow)/DATA.providers.length;
  const correct = exc.filter(e=>['Approved','Auto-resolved','Resolved via outreach'].includes(e.status)).length;
  const nsm = totalIssues? correct/totalIssues : 0;
  const human = exc.filter(e=>['Approved','Overridden'].includes(e.status));
  const overrideRate = human.length? exc.filter(e=>e.status==='Overridden').length/human.length : 0;
  const riskyAuto = exc.filter(e=>e.auto && e.confidence<0.9).length;
  const calls = S.outreach.length, offices = new Set(S.outreach.map(o=>o.pid)).size;
  return {processed:processed.length, rowsProcessed, open, inOut, done, touchless, acc, totalIssues, fixed, nsm, correct, overrideRate, riskyAuto, calls, offices};
}

function attention(){
  const items=[];
  const waiting=S.rosters.filter(r=>r.status!=='Processed');
  if(waiting.length) items.push([`${waiting.length} roster${waiting.length>1?'s':''} received and ready to process`, waiting.map(r=>groupBy[r.gid].name).join(', '), 'intake', 'Process']);
  const open=S.exceptions.filter(e=>e.status==='Open');
  const low=open.filter(e=>e.confidence<0.6).length;
  if(open.length) items.push([`${open.length} exception${open.length>1?'s':''} awaiting review`, low?`${low} low-confidence, may need provider verification`:'evidence and suggested fix ready', 'exceptions', 'Review']);
  const q=S.outreach.filter(o=>o.status==='Queued').length;
  if(q) items.push([`${q} verification call${q>1?'s':''} queued`, 'results write back to the record automatically', 'outreach', 'Open']);
  const late=S.exceptions.filter(e=>e.kind==='Retro termination'&&['Open','In outreach'].includes(e.status)).length;
  if(late) items.push([`${late} change past the 30-day update window`, 'retroactive termination: claims since the effective date may be affected', 'compliance', 'View']);
  if(!items.length) return `<div class="empty small">All caught up. Attestation evidence is current.</div>`;
  return items.map(([t,sub,go,b])=>`<div class="chk" style="justify-content:space-between"><div><b>${esc(t)}</b><div class="small muted">${esc(sub)}</div></div><button class="btn" data-go="${go}">${b}</button></div>`).join('')+
    (waiting.length>1?`<div class="row" style="margin-top:10px"><button class="btn pri" id="runall">Process all received rosters</button></div>`:'');
}
function excByType(){
  if(!S.exceptions.length) return `<div class="empty small">Process a roster to see exceptions.</div>`;

}

function policyNumbers(t){
  const elig = DATA.issues.filter(i=>!NEVER_AUTO.includes(i.kind));
  const auto = elig.filter(i=>i.confidence>=t);
  return {auto:auto.length, review:DATA.issues.length-auto.length, risky:auto.filter(i=>i.confidence<0.9).length};
}
function policyCard(){
  const n = policyNumbers(S.threshold);
  return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Automation policy</h2><span class="small muted">Set by your compliance lead · applies to the next roster processed</span></div>
  <div class="row" style="margin-top:10px;gap:14px"><span>Auto-apply a fix when confidence is at least</span>
    <input type="range" id="thr" min="80" max="99" step="1" value="${Math.round(S.threshold*100)}" style="width:220px"><b id="thrv" class="mono">${Math.round(S.threshold*100)}%</b></div>
  <div class="small" id="thrx" style="margin-top:8px;color:var(--ink2)">${policyText(n)}</div>
  <div class="small muted" style="margin-top:6px">Guardrail: removing a provider or applying a termination always goes to a person, at any threshold. In healthcare the cost of a wrong automated change is high, so the AI recommends and a person decides.</div></div>`;

function policyText(n){return `Across all three rosters: <b>${n.auto}</b> of ${DATA.issues.length} known issues auto-apply, <b>${n.review}</b> go to a person${n.risky?`, <b style="color:var(--bad)">${n.risky} auto-applied below 90% confidence</b> (less manual review, more risk)`:''}.`}
function processRoster(gid){
  const r = S.rosters.find(x=>x.gid===gid); if(r.status==='Processed') return;
  const stages=['Parsing layout','Standardizing names, addresses, specialties','Matching to plan records (NPI + TIN + location)','Validating against self-attested source, state board, registry','Scoring confidence and routing exceptions'];
  $('#proc')?.classList.remove('hidden'); let i=0;
  const btn=$('#process'); if(btn) btn.disabled=true;
  const tick=()=>{
    if($('#procbar')) $('#procbar').style.width=((i+1)/stages.length*100)+'%';
    if($('#procmsg')) $('#procmsg').textContent=stages[i];
    i++; if(i<stages.length) setTimeout(tick,380); else setTimeout(()=>{finishRoster(gid); render();},400);
  }; tick();
}
function finishRoster(gid){
  const r = S.rosters.find(x=>x.gid===gid); if(r.status==='Processed') return;
  r.status='Processed';
  const iss = DATA.issues.filter(i=>i.roster===gid);
  iss.forEach((i,k)=>{
    const guarded = NEVER_AUTO.includes(i.kind);
    const auto = !guarded && i.confidence>=S.threshold;
    S.exceptions.push({...i, id:`E-${gid}-${k+1}`, status: auto?'Auto-resolved':'Open', auto, appliedAt:S.threshold,
      note: auto?`Auto-applied (confidence ${Math.round(i.confidence*100)}% ≥ policy ${Math.round(S.threshold*100)}%)`:(guarded&&i.confidence>=S.threshold?'Guardrail: removals and terminations always need a person, whatever the confidence':'')});
    if(auto) log('Automated validation','Auto-resolved',`${i.kind}: ${i.detail}`);
  });
  log('Automated validation','Processed roster',`${groupBy[gid].name}: ${r.rows} rows, ${iss.length} exceptions (${iss.filter(i=>i.confidence>=0.95).length} auto-resolved)`);
  toast(`${groupBy[gid].name}: ${r.rows} rows processed, ${S.exceptions.filter(e=>e.roster===gid&&e.status==='Open').length} need review`);
}

function script(o){
  const p = byId[o.pid]; const office = p?`${p.last} ${p.specialty.includes('Psych')||p.specialty.includes('Social')?'Behavioral Health':'Medical'} Office`:'Office';
  if(o.reason==='Possible ghost listing') return {lines:[
    ['sys',`Dialing ${p.phone} · IVR detected`],['ag','Agent: Navigating menu → option 0 (front desk)'],
    ['of',`Office: ${office}, how can I help?`],['ag',`Agent: I'm calling on behalf of MidAmerica Health to confirm directory details for Dr. ${p.last}. Is Dr. ${p.last} still seeing patients at this location?`],
    ['of',`Office: No, Dr. ${p.last} retired in the spring. We haven't updated the insurers yet.`],['ag','Agent: Thank you. Is there another provider taking their patients?'],
    ['of','Office: Dr. Pruitt took over the panel, she is accepting new patients.'],['sys','Structured result: provider_left_practice=true · successor_lead=captured · confidence 0.97']],
    result:'Provider left practice', excStatus:'Resolved via outreach', note:'Removed from directory. Adequacy recheck triggered; successor provider lead sent to network team.'};
  if(o.reason==='Invalid phone') return {lines:[
    ['sys','Number on roster is invalid · dialing self-attested number instead'],['of','Office: Riverbend Pediatrics.'],
    ['ag',`Agent: Confirming the best phone number for appointments with Dr. ${p.last}?`],['of',`Office: Yes, it's this one, ${p.phone}.`],
    ['sys','Structured result: phone_confirmed · confidence 0.96']], result:'Confirmed', excStatus:'Resolved via outreach', note:'Phone corrected from outreach confirmation.'};
  return {lines:[['sys',`Dialing ${p?p.phone:'registry match'}`],['of','Office: Hello, front desk.'],['ag','Agent: Confirming address, phone and whether the provider is accepting new patients…'],['of','Office: All of that is correct, and yes, accepting new patients.'],['sys','Structured result: attributes_confirmed · confidence 0.95']],
    result:'Confirmed', excStatus:'Resolved via outreach', note:'Details confirmed by provider office.'};
}
function runCall(){
  const o = S.outreach.find(x=>x.id===S.selectedCall); if(!o||o.status!=='Queued') return;
  const s = script(o); const tx=$('#tx'); tx.innerHTML=''; $('#runcall').disabled=true; let i=0; let html='';
  const step=()=>{ const [k,t]=s.lines[i]; html+=`<span class="${k}">${esc(t)}</span>\n`; tx.innerHTML=html; i++;
    if(i<s.lines.length) setTimeout(step,520); else {
      o.status = s.result==='Confirmed'?'Confirmed':s.result; o.result=s.result; o.tx=html;
      const e=S.exceptions.find(x=>x.id===o.exc); if(e){e.status=s.excStatus; e.note=s.note;}
      log('Outreach agent','Call completed',`${o.id} ${nm(byId[o.pid])}: ${s.result}`);
      toast('Call result written back to the record'); setTimeout(render,500);} };
  step();
}

function vCompliance(){
  const changes = S.exceptions.filter(e=>!['Open','In outreach','Overridden'].includes(e.status) && e.pid);
  const pending = S.exceptions.filter(e=>['Open','In outreach'].includes(e.status));
  const m = metrics();
  const daysLeft = e=> e.kind==='Retro termination'? -42 : 30 - (e.id.charCodeAt(e.id.length-1)%9);
  const checks = [
    ['Every directory change has source evidence and timestamp', S.audit.length>0],
    ['All roster changes reflected within 30 days', pending.every(e=>daysLeft(e)>0) && S.rosters.every(r=>r.status==='Processed')],
    ['Inactive / lapsed providers suppressed from directory', !S.exceptions.some(e=>['License lapsed','Possible ghost listing'].includes(e.kind) && ['Open','In outreach'].includes(e.status)) && S.exceptions.some(e=>e.kind==='License lapsed')],
    ['Network adequacy rechecked after removals', S.outreach.some(o=>o.result==='Provider left practice')],
    ['Open exceptions below 5% of roster rows', S.exceptions.length>0 && m.open/Math.max(1,m.rowsProcessed)<0.05],
  ];
  const ready = checks.filter(c=>c[1]).length;
  return `${header('4 · Directory &amp; compliance', 'Every change tracked against the 30-day CMS update window, with the evidence for your annual directory attestation built as work is done.', 'compliance')}
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card kpi"><div class="lab">Changes pushed to directory</div><div class="val">${changes.length}</div><div class="sub">with audit evidence</div></div>
    <div class="card kpi"><div class="lab">Changes still pending</div><div class="val">${pending.length}</div><div class="sub">${pending.filter(e=>daysLeft(e)<=0).length} past the 30-day clock</div></div>
    <div class="card kpi"><div class="lab">Attestation readiness</div><div class="val">${ready} / ${checks.length}</div><div class="sub">checks passing</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>30-day update clock</h2>${pending.length?`<table><tr><th>Change</th><th>Provider</th><th>Days left</th></tr>${pending.map(e=>{const d=daysLeft(e);return `<tr><td>${kindPill(e.kind)}</td><td>${esc(nm(byId[e.pid]))}</td><td>${d<=0?`<span class="pill p-bad">${Math.abs(d)} days late</span>`:`<span class="pill ${d<25?'p-warn':'p-grey'}">${d} days</span>`}</td></tr>`}).join('')}</table>`:`<div class="empty small">${S.exceptions.length?'Nothing pending. All changes are within the clock.':'Process rosters to start the clock.'}</div>`}</div>
    <div class="card"><h2>Attestation evidence pack</h2>${checks.map(([t,ok])=>`<div class="chk"><span class="dot" style="background:${ok?'var(--good)':'#cfd5de'}"></span>${esc(t)}</div>`).join('')}
      <div class="row" style="margin-top:12px"><button class="btn" id="pack" ${ready<checks.length?'disabled':''}>Generate attestation pack</button><span class="small muted">${ready<checks.length?'Complete the open checks first':'Ready'}</span></div></div>
  </div>`;
}

function vAudit(){
  return `${header('Audit trail','Every automated and human decision, with who made it, when and why. Exportable for regulators and internal audit.')}
  <div class="card">${S.audit.length?`<table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr>${S.audit.map(a=>`<tr><td class="mono">${a.t}</td><td>${a.actor.includes('Automated')||a.actor.includes('agent')?`<span class="pill p-acc">${esc(a.actor)}</span>`:`<span class="pill p-grey">${esc(a.actor)}</span>`}</td><td><b>${esc(a.action)}</b></td><td class="small">${esc(a.detail)}</td></tr>`).join('')}</table>`:`<div class="empty">No activity yet.</div>`}</div>`;
}

/* ---------------- router ---------------- */
const VIEWS={overview:vOverview,intake:vIntake,exceptions:vExceptions,outreach:vOutreach,compliance:vCompliance,audit:vAudit};
function current(){const h=location.hash.slice(1);return VIEWS[h]?h:'overview'}
function render(){
  const v=current();
  document.querySelectorAll('nav a[data-v]').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
  $('#main').innerHTML=VIEWS[v]();
  const waiting=S.rosters.filter(r=>r.status!=='Processed').length;
  $('#nb-intake').textContent=waiting||''; $('#nb-intake').classList.toggle('hidden',!waiting);
  const op=S.exceptions.filter(e=>e.status==='Open').length; $('#nb-exc').textContent=op; $('#nb-exc').classList.toggle('hidden',!op);
  const q=S.outreach.filter(o=>o.status==='Queued').length; $('#nb-out').textContent=q; $('#nb-out').classList.toggle('hidden',!q);
  $('#nb-audit').textContent=S.audit.length; $('#nb-audit').classList.toggle('hidden',!S.audit.length);
}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-mode],[data-roster],[data-exc],[data-act],[data-call],#process,#runall,#runcall,#seedout,#reset,#pack');
  if(!t) return;
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.mode){S.mode=t.dataset.mode;render();return}
  if(t.dataset.roster){S.selectedRoster=t.dataset.roster;render();return}
  if(t.dataset.exc){S.selectedExc=t.dataset.exc;render();return}
  if(t.dataset.act){actOnExc(t.dataset.act);return}
  if(t.dataset.call){S.selectedCall=t.dataset.call;render();return}
  if(t.id==='process'){processRoster(t.dataset.g);return}
  if(t.id==='runall'){DATA.groups.forEach(g=>finishRoster(g.id));render();return}
  if(t.id==='runcall'){runCall();return}
  if(t.id==='seedout'){S.exceptions.filter(e=>e.status==='Open'&&e.confidence<0.6).forEach(e=>{e.status='In outreach';S.outreach.push({id:'C-'+(S.outreach.length+101),exc:e.id,pid:e.pid,status:'Queued',reason:e.kind});log('Analyst (A. Rivera)','Sent to outreach',`${e.kind} for ${nm(byId[e.pid])}`)});render();return}
  if(t.id==='reset'){ev.preventDefault();S=freshState();clock=new Date('2026-11-11T09:12:00');location.hash='overview';render();toast('Data reset');return}
  if(t.id==='pack'){log('Compliance (J. Osei)','Generated attestation pack','Evidence for annual directory accuracy attestation compiled from audit trail');toast('Attestation pack compiled from the audit trail');render();return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='excf'){S.excFilter=ev.target.value;S.selectedExc=null;render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='thr'){S.threshold=ev.target.value/100;$('#thrv').textContent=ev.target.value+'%';$('#thrx').innerHTML=policyText(policyNumbers(S.threshold));}});
render();
</script>
</body>
